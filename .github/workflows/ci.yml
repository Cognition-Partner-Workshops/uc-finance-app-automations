name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traderx-monolith
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: traderx-monolith/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

  e2e-tests:
    name: Frontend (Playwright e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_SERVICE_REACT_PORT: '18094'
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: traderx-monolith/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-front-end/react/package-lock.json

      - name: Install backend dependencies
        run: pip install -r traderx-monolith/requirements.txt

      - name: Seed a fresh golden database
        working-directory: traderx-monolith
        run: |
          rm -f traderx.db
          python -c "from app.database import create_tables; create_tables(); from app.seed import seed_database; seed_database()"

      - name: Start backend
        working-directory: traderx-monolith
        run: |
          nohup python run.py > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            body="$(curl -sf "$BACKEND_URL/health" || true)"
            if [ "$body" = '{"status":"UP"}' ]; then
              echo "Backend healthy: $body"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in time"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: web-front-end/react
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web-front-end/react
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: web-front-end/react
        env:
          BROWSER: none
          CI: 'true'
        run: |
          nohup npm start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 180); do
            if curl -sf "http://localhost:$WEB_SERVICE_REACT_PORT" > /dev/null; then
              echo "Frontend serving on :$WEB_SERVICE_REACT_PORT"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start in time"
          cat "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Run Playwright e2e suite
        working-directory: web-front-end/react
        env:
          E2E_BASE_URL: http://localhost:18094
          E2E_BACKEND_URL: http://localhost:8000
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-front-end/react/playwright-report/
          retention-days: 14

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
